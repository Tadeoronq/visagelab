<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VisageLab - Visor Avatar 3D (4 Capas)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #090d14;
      color: #e6edf7;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #visor-3d {
      flex: 1;
      position: relative;
      touch-action: none;
      background: radial-gradient(circle at 50% 35%, #16233a 0%, #090d14 75%);
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(13, 20, 34, 0.85);
      border: 1px solid rgba(94, 234, 212, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }
    .hud strong { color: #5eead4; font-size: 13px; }
    #panel {
      width: 350px;
      max-width: 100%;
      background: #101724;
      border-left: 1px solid #1e293b;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tarjeta {
      background: #172133;
      border: 1px solid #26354d;
      border-radius: 10px;
      padding: 12px;
    }
    .tarjeta h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #5eead4;
      margin-bottom: 10px;
    }
    .grid-capas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn-capa {
      background: #0d1422;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-capa.activa {
      background: rgba(45, 212, 191, 0.16);
      color: #5eead4;
      border-color: #2dd4bf;
    }
    .fila-check {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 4px;
    }
    .control { margin-bottom: 8px; }
    .control:last-child { margin-bottom: 0; }
    .control label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 3px;
      color: #cbd5e1;
    }
    .control span.val { color: #38bdf8; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: #2dd4bf; cursor: pointer; }
    select, input[type="color"] {
      width: 100%;
      background: #0d1422;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
    }
    input[type="color"] { height: 30px; padding: 2px; cursor: pointer; }

    @media (max-width: 820px) {
      body { flex-direction: column; }
      #visor-3d { height: 48vh; flex: none; }
      #panel { height: 52vh; width: 100%; border-left: none; border-top: 1px solid #1e293b; }
    }
  </style>
</head>
<body>
  <div id="visor-3d">
    <div class="hud">
      <strong>VISAGELAB · INSPECTOR DE 4 CAPAS</strong><br />
      Arrastra con mouse o dedo para rotar · Rueda para zoom<br />
      <span id="estado-capas">Capas activas: Esqueleto + Músculo + Grasa + Piel</span>
    </div>
  </div>

  <aside id="panel">
    <div class="tarjeta">
      <h3>Visibilidad de Capas</h3>
      <div class="grid-capas">
        <button type="button" class="btn-capa activa" data-capa="esqueleto">1. Esqueleto</button>
        <button type="button" class="btn-capa activa" data-capa="musculo">2. Músculo</button>
        <button type="button" class="btn-capa activa" data-capa="grasa">3. Grasa</button>
        <button type="button" class="btn-capa activa" data-capa="piel">4. Piel</button>
      </div>
      <label class="fila-check">
        <span>Piel translúcida</span>
        <input type="checkbox" id="piel-translucida" />
      </label>
    </div>

    <div class="tarjeta">
      <h3>Base y Postura (Capa 1)</h3>
      <div class="control">
        <label>Estatura <span class="val" id="v-estatura">175 cm</span></label>
        <input type="range" id="estatura" min="150" max="200" step="1" value="175" />
      </div>
      <div class="control">
        <label>Escoliosis <span class="val" id="v-escoliosis">0.0°</span></label>
        <input type="range" id="escoliosis" min="-15" max="15" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Cifosis <span class="val" id="v-cifosis">0.0°</span></label>
        <input type="range" id="cifosis" min="-10" max="25" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Hombros adelantados <span class="val" id="v-hombros-ad">0.0°</span></label>
        <input type="range" id="hombros-ad" min="0" max="25" step="0.5" value="0" />
      </div>
    </div>

    <div class="tarjeta">
      <h3>Composición y Piel (Capas 2, 3 y 4)</h3>
      <div class="control">
        <label>Sexo <select id="sexo">
          <option value="masculino" selected>Masculino</option>
          <option value="femenino">Femenino</option>
        </select></label>
      </div>
      <div class="control">
        <label>Morfología <select id="morfologia">
          <option value="ectomorfo">Ectomorfo</option>
          <option value="mesomorfo" selected>Mesomorfo</option>
          <option value="endomorfo">Endomorfo</option>
        </select></label>
      </div>
      <div class="control">
        <label>Color de piel <input type="color" id="color-piel" value="#d9a37a" /></label>
      </div>
      <div class="control">
        <label>Peso <span class="val" id="v-peso">75.0 kg</span></label>
        <input type="range" id="peso" min="45" max="135" step="0.5" value="75" />
      </div>
      <div class="control">
        <label>Grasa total <span class="val" id="v-grasa">18.0 %</span></label>
        <input type="range" id="grasa" min="5" max="45" step="0.5" value="18" />
      </div>
      <div class="control">
        <label>Músculo tronco <span class="val" id="v-musc-tronco">18.5 kg</span></label>
        <input type="range" id="musc-tronco" min="8" max="32" step="0.5" value="18.5" />
      </div>
      <div class="control">
        <label>Bíceps <span class="val" id="v-biceps">35.0 cm</span></label>
        <input type="range" id="biceps" min="22" max="50" step="0.5" value="35" />
      </div>
    </div>
  </aside>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js";
    import { crearCapaEsqueleto } from "./capa_esqueleto.js";
    import { crearCapaMusculo } from "./capa_musculo.js";
    import { crearCapaGrasa } from "./capa_grasa.js";
    import { crearCapaPiel } from "./capa_piel.js";

    const contenedor = document.getElementById("visor-3d");

    function mostrarError(msg) {
      let box = document.getElementById("error-visor");
      if (!box) {
        box = document.createElement("div");
        box.id = "error-visor";
        box.style.cssText =
          "position:absolute;bottom:14px;left:14px;right:14px;background:#450a0a;color:#fecaca;border:1px solid #f87171;padding:10px 14px;border-radius:8px;font-size:12px;z-index:20;";
        contenedor.appendChild(box);
      }
      box.textContent = "Error en visor 3D: " + msg;
    }

    window.addEventListener("error", (e) => mostrarError(e.message || String(e)));
    window.addEventListener("unhandledrejection", (e) =>
      mostrarError(e.reason?.message || String(e.reason))
    );

    const escena = new THREE.Scene();
    const camara = new THREE.PerspectiveCamera(
      42,
      Math.max(1, contenedor.clientWidth) / Math.max(1, contenedor.clientHeight),
      0.1,
      100
    );

    const renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderizador.setSize(contenedor.clientWidth, contenedor.clientHeight);
    renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderizador.shadowMap.enabled = true;
    contenedor.appendChild(renderizador.domElement);

    escena.add(new THREE.AmbientLight(0xffffff, 0.85));

    const luzPrincipal = new THREE.DirectionalLight(0xffffff, 1.2);
    luzPrincipal.position.set(2.5, 4, 3);
    luzPrincipal.castShadow = true;
    escena.add(luzPrincipal);

    const luzRelleno = new THREE.DirectionalLight(0x5eead4, 0.55);
    luzRelleno.position.set(-3, 2, -2);
    escena.add(luzRelleno);

    const rejilla = new THREE.GridHelper(4, 16, 0x2dd4bf, 0x1e293b);
    escena.add(rejilla);

    const avatarRaiz = new THREE.Group();
    escena.add(avatarRaiz);

    const capaEsqueleto = crearCapaEsqueleto();
    const capaMusculo = crearCapaMusculo();
    const capaGrasa = crearCapaGrasa();
    const capaPiel = crearCapaPiel();

    avatarRaiz.add(
      capaEsqueleto.group,
      capaMusculo.group,
      capaGrasa.group,
      capaPiel.group
    );

    const capas = {
      esqueleto: capaEsqueleto,
      musculo: capaMusculo,
      grasa: capaGrasa,
      piel: capaPiel
    };

    const visibilidad = {
      esqueleto: true,
      musculo: true,
      grasa: true,
      piel: true
    };

    function leerParametros() {
      const valNum = (id) => parseFloat(document.getElementById(id).value);
      return {
        estaturaCm: valNum("estatura"),
        escoliosisDeg: valNum("escoliosis"),
        cifosisDeg: valNum("cifosis"),
        hombrosAdelantadosDeg: valNum("hombros-ad"),
        sexo: document.getElementById("sexo").value,
        morfologia: document.getElementById("morfologia").value,
        colorPiel: document.getElementById("color-piel").value,
        translucida: document.getElementById("piel-translucida").checked,
        pesoKg: valNum("peso"),
        grasaTotalPct: valNum("grasa"),
        grasaSuperiorPct: valNum("grasa"),
        grasaTroncoPct: valNum("grasa"),
        grasaInferiorPct: valNum("grasa"),
        musculoTroncoKg: valNum("musc-tronco"),
        bicepsCm: valNum("biceps")
      };
    }

    function actualizarEtiquetas(p) {
      document.getElementById("v-estatura").textContent = `${p.estaturaCm.toFixed(0)} cm`;
      document.getElementById("v-escoliosis").textContent = `${p.escoliosisDeg.toFixed(1)}°`;
      document.getElementById("v-cifosis").textContent = `${p.cifosisDeg.toFixed(1)}°`;
      document.getElementById("v-hombros-ad").textContent = `${p.hombrosAdelantadosDeg.toFixed(1)}°`;
      document.getElementById("v-peso").textContent = `${p.pesoKg.toFixed(1)} kg`;
      document.getElementById("v-grasa").textContent = `${p.grasaTotalPct.toFixed(1)} %`;
      document.getElementById("v-musc-tronco").textContent = `${p.musculoTroncoKg.toFixed(1)} kg`;
      document.getElementById("v-biceps").textContent = `${p.bicepsCm.toFixed(1)} cm`;

      const activas = Object.entries(visibilidad)
        .filter(([, on]) => on)
        .map(([nombre]) => nombre[0].toUpperCase() + nombre.slice(1));

      document.getElementById("estado-capas").textContent =
        `Capas activas: ${activas.length ? activas.join(" + ") : "Ninguna"}`;
    }

    function refrescarAvatar() {
      try {
        const p = leerParametros();
        actualizarEtiquetas(p);

        Object.entries(visibilidad).forEach(([clave, activa]) => {
          capas[clave].group.visible = activa;
        });

        capaEsqueleto.actualizar(p);
        const contexto = { ...p, anclajes: capaEsqueleto.anclajes };
        capaMusculo.actualizar(contexto);
        capaGrasa.actualizar(contexto);
        capaPiel.actualizar(contexto);
      } catch (err) {
        mostrarError(err.message || String(err));
      }
    }

    document.querySelectorAll(".btn-capa").forEach((btn) => {
      btn.addEventListener("click", () => {
        const nombreCapa = btn.dataset.capa;
        visibilidad[nombreCapa] = !visibilidad[nombreCapa];
        btn.classList.toggle("activa", visibilidad[nombreCapa]);
        refrescarAvatar();
      });
    });

    document.querySelectorAll("#panel input, #panel select").forEach((el) => {
      el.addEventListener("input", refrescarAvatar);
      el.addEventListener("change", refrescarAvatar);
    });

    let arrastrando = false;
    let prevX = 0;
    let prevY = 0;
    let rotY = 0;
    let rotX = 0.12;
    let distancia = 3.35;

    function actualizarCamara() {
      const yObjetivo = 0.95;
      camara.position.x = distancia * Math.sin(rotY) * Math.cos(rotX);
      camara.position.y = yObjetivo + distancia * Math.sin(rotX);
      camara.position.z = distancia * Math.cos(rotY) * Math.cos(rotX);
      camara.lookAt(0, yObjetivo, 0);
    }

    renderizador.domElement.addEventListener("pointerdown", (e) => {
      arrastrando = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener("pointerup", () => { arrastrando = false; });

    window.addEventListener("pointermove", (e) => {
      if (!arrastrando) return;
      rotY += (e.clientX - prevX) * 0.008;
      rotX = THREE.MathUtils.clamp(rotX + (e.clientY - prevY) * 0.006, -0.6, 0.9);
      prevX = e.clientX;
      prevY = e.clientY;
      actualizarCamara();
    });

    renderizador.domElement.addEventListener("wheel", (e) => {
      e.preventDefault();
      distancia = THREE.MathUtils.clamp(distancia + e.deltaY * 0.0018, 1.5, 6.0);
      actualizarCamara();
    }, { passive: false });

    window.addEventListener("resize", () => {
      camara.aspect = Math.max(1, contenedor.clientWidth) / Math.max(1, contenedor.clientHeight);
      camara.updateProjectionMatrix();
      renderizador.setSize(contenedor.clientWidth, contenedor.clientHeight);
    });

    refrescarAvatar();
    actualizarCamara();

    function bucleAnimacion() {
      requestAnimationFrame(bucleAnimacion);
      renderizador.render(escena, camara);
    }
    bucleAnimacion();
  </script>
</body>
</html>
