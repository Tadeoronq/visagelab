<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VisageLab - Visor Avatar 3D (4 Capas con 12 Parámetros Posturales)</title>
  
  <!-- ============================================================================
  [BLOQUE 1] ESTILOS CSS DEL ENTORNO VISUAL Y CONTROLES
  Función: Define la interfaz de usuario (HUD) del visor 3D, el panel lateral
  de controles (sliders) adaptativo a dispositivos móviles y el diseño oscuro 
  (dark mode) del sistema VisageLab.
  ============================================================================ -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #090d14;
      color: #e6edf7;
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    #visor-3d {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 300px;
      position: relative;
      touch-action: none;
      background: radial-gradient(circle at 50% 35%, #16233a 0%, #090d14 75%);
    }
    #visor-3d canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute; top: 14px; left: 14px;
      background: rgba(13, 20, 34, 0.88); border: 1px solid rgba(94, 234, 212, 0.28);
      border-radius: 10px; padding: 10px 14px; font-size: 12px; line-height: 1.45;
      pointer-events: none; z-index: 5;
    }
    .hud strong { color: #5eead4; font-size: 13px; }
    #error-visor {
      display: none; position: absolute; bottom: 14px; left: 14px; right: 14px;
      background: rgba(69, 10, 10, 0.95); color: #fecaca; border: 1px solid #f87171;
      padding: 10px 14px; border-radius: 8px; font-size: 12px; z-index: 20;
    }
    #panel {
      width: 380px; flex-shrink: 0; background: #101724; border-left: 1px solid #1e293b;
      padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 10;
    }
    .tarjeta {
      background: #172133; border: 1px solid #26354d; border-radius: 10px; padding: 12px;
    }
    .tarjeta h3 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: #5eead4; margin-bottom: 10px;
    }
    .grid-capas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 8px; }
    .btn-capa {
      background: #0d1422; color: #94a3b8; border: 1px solid #334155;
      border-radius: 7px; padding: 7px 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-capa.activa { background: rgba(45, 212, 191, 0.16); color: #5eead4; border-color: #2dd4bf; }
    .fila-check { display: flex; align-items: center; justify-content: space-between; font-size: 12px; margin-top: 4px; }
    .control { margin-bottom: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; color: #cbd5e1; }
    .control span.val { color: #38bdf8; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: #2dd4bf; cursor: pointer; }
    
    @media (max-width: 820px) {
      body { flex-direction: column; }
      #visor-3d { height: 48vh; width: 100%; flex: none; }
      #panel { height: 52vh; width: 100%; border-left: none; border-top: 1px solid #1e293b; }
    }
  </style>
</head>
<body>
  
  <!-- ============================================================================
  [BLOQUE 2] CONTENEDOR 3D Y PANEL DE CONTROLES (LOS 12 PARÁMETROS)
  Función: Estructura HTML con los sliders para los 12 nuevos parámetros clínicos
  (cifosis, hiperlordosis, escoliosis, escápulas, pelvis, etc.) organizados por
  segmentos corporales.
  ============================================================================ -->
  <div id="visor-3d">
    <div class="hud">
      <strong>VISAGELAB · INSPECTOR DE CAPAS</strong><br />
      Arrastra para rotar · Rueda para zoom<br />
      <span id="estado-capas">Capas activas: Esqueleto + Músculo + Grasa + Piel</span>
    </div>
    <div id="error-visor"></div>
  </div>

  <aside id="panel">
    <div class="tarjeta">
      <h3>Visibilidad de Capas</h3>
      <div class="grid-capas">
        <button type="button" class="btn-capa activa" data-capa="esqueleto">1. Esqueleto</button>
        <button type="button" class="btn-capa activa" data-capa="musculo">2. Músculo</button>
        <button type="button" class="btn-capa activa" data-capa="grasa">3. Grasa</button>
        <button type="button" class="btn-capa activa" data-capa="piel">4. Piel</button>
      </div>
      <label class="fila-check">
        <span>Piel translúcida</span>
        <input type="checkbox" id="piel-translucida" />
      </label>
    </div>

    <div class="tarjeta">
      <h3>Estructura Base</h3>
      <div class="control">
        <label>Estatura <span class="val" id="v-estatura">175 cm</span></label>
        <input type="range" id="estatura" min="150" max="200" step="1" value="175" />
      </div>
      <div class="control">
        <label>Morfología Tórax <span class="val" id="v-morfo-torax">1.0</span></label>
        <input type="range" id="morfo-torax" min="0.82" max="1.22" step="0.02" value="1.0" title="Ángulo subcostal y diámetro" />
      </div>
    </div>

    <div class="tarjeta">
      <h3>A. Columna Vertebral</h3>
      <div class="control">
        <label>Cifosis Dorsal <span class="val" id="v-cifosis">0.0°</span></label>
        <input type="range" id="cifosis" min="-10" max="30" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Hiperlordosis Lumbar <span class="val" id="v-lordosis">0.0°</span></label>
        <input type="range" id="lordosis" min="-10" max="35" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Escoliosis Torácica <span class="val" id="v-escoliosis-t">0.0°</span></label>
        <input type="range" id="escoliosis-t" min="-20" max="20" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Escoliosis Lumbar <span class="val" id="v-escoliosis-l">0.0°</span></label>
        <input type="range" id="escoliosis-l" min="-20" max="20" step="0.5" value="0" />
      </div>
    </div>

    <div class="tarjeta">
      <h3>B. Cuello y Cintura Escapular</h3>
      <div class="control">
        <label>Antepulsión Cuello <span class="val" id="v-antepulsion">0.0 cm</span></label>
        <input type="range" id="antepulsion" min="0" max="12" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Hombros Adelantados <span class="val" id="v-hombros-ad">0.0°</span></label>
        <input type="range" id="hombros-ad" min="0" max="25" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Escápulas Aladas <span class="val" id="v-escapulas">0.0°</span></label>
        <input type="range" id="escapulas" min="0" max="20" step="0.5" value="0" />
      </div>
      <div class="control">
        <label>Asimetría Hombros <span class="val" id="v-asim-hombros">0.0 cm</span></label>
        <input type="range" id="asim-hombros" min="-5" max="5" step="0.5" value="0" />
      </div>
    </div>

    <div class="tarjeta">
      <h3>D. Pelvis y Cadera</h3>
      <div class="control">
        <label>Anteversión Pélvica <span class="val" id="v-anteversion">0.0°</span></label>
        <input type="range" id="anteversion" min="-15" max="25" step="0.5" value="0" title="Adelante: Anteversión / Atrás: Retroversión" />
      </div>
      <div class="control">
        <label>Basculación Lateral <span class="val" id="v-basculacion">0.0°</span></label>
        <input type="range" id="basculacion" min="-10" max="10" step="0.5" value="0" />
      </div>
    </div>
  </aside>

  <!-- ============================================================================
  [BLOQUE 3] LÓGICA DE INTERFAZ Y LECTURA DE PARÁMETROS
  Función: Recopila los valores de los sliders del HTML y los formatea en un objeto
  JavaScript para pasárselo al motor 3D de las capas en tiempo real.
  ============================================================================ -->
  <script>
    const visorEl = document.getElementById("visor-3d");
    const errorBox = document.getElementById("error-visor");

    function mostrarError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = "Error: " + msg;
    }

    const visibilidad = { esqueleto: true, musculo: true, grasa: true, piel: true };
    let aplicarCambios = () => {};

    // Lee todos los controles y los empaqueta en el objeto de parámetros
    function leerParametros() {
      const val = (id) => parseFloat(document.getElementById(id).value);
      return {
        estaturaCm: val("estatura"),
        morfologiaTorax: val("morfo-torax"),
        cifosisDeg: val("cifosis"),
        hiperlordosisDeg: val("lordosis"),
        escoliosisToracicaDeg: val("escoliosis-t"),
        escoliosisLumbarDeg: val("escoliosis-l"),
        antepulsionCuelloCm: val("antepulsion"),
        hombrosAdelantadosDeg: val("hombros-ad"),
        escapulasAladasDeg: val("escapulas"),
        asimetriaHombrosCm: val("asim-hombros"),
        anteversionPelvicaDeg: val("anteversion"),
        basculacionPelvicaDeg: val("basculacion"),
        translucida: document.getElementById("piel-translucida").checked
      };
    }

    // Actualiza los textos azules con el valor numérico en vivo
    function actualizarEtiquetas(p) {
      document.getElementById("v-estatura").textContent = `${p.estaturaCm.toFixed(0)} cm`;
      document.getElementById("v-morfo-torax").textContent = p.morfologiaTorax.toFixed(2);
      document.getElementById("v-cifosis").textContent = `${p.cifosisDeg.toFixed(1)}°`;
      document.getElementById("v-lordosis").textContent = `${p.hiperlordosisDeg.toFixed(1)}°`;
      document.getElementById("v-escoliosis-t").textContent = `${p.escoliosisToracicaDeg.toFixed(1)}°`;
      document.getElementById("v-escoliosis-l").textContent = `${p.escoliosisLumbarDeg.toFixed(1)}°`;
      document.getElementById("v-antepulsion").textContent = `${p.antepulsionCuelloCm.toFixed(1)} cm`;
      document.getElementById("v-hombros-ad").textContent = `${p.hombrosAdelantadosDeg.toFixed(1)}°`;
      document.getElementById("v-escapulas").textContent = `${p.escapulasAladasDeg.toFixed(1)}°`;
      document.getElementById("v-asim-hombros").textContent = `${p.asimetriaHombrosCm.toFixed(1)} cm`;
      document.getElementById("v-anteversion").textContent = `${p.anteversionPelvicaDeg.toFixed(1)}°`;
      document.getElementById("v-basculacion").textContent = `${p.basculacionPelvicaDeg.toFixed(1)}°`;
    }

    // Eventos de clics en los botones de visibilidad de capas
    document.querySelectorAll(".btn-capa").forEach((btn) => {
      btn.addEventListener("click", () => {
        const capa = btn.dataset.capa;
        visibilidad[capa] = !visibilidad[capa];
        btn.classList.toggle("activa", visibilidad[capa]);
        aplicarCambios();
      });
    });

    // Escucha cambios en cualquier slider o checkbox
    document.querySelectorAll("#panel input").forEach((el) => {
      const onChange = () => {
        actualizarEtiquetas(leerParametros());
        aplicarCambios();
      };
      el.addEventListener("input", onChange);
      el.addEventListener("change", onChange);
    });

    actualizarEtiquetas(leerParametros());
  </script>

  <!-- ============================================================================
  [BLOQUE 4] INICIALIZACIÓN THREE.JS Y ENTORNO PBR (REALISMO FOTOMÉTRICO)
  Función: Carga la escena, establece un mapeo de tonos ACESFilmic (para luces
  realistas de piel y hueso) y configura la cámara y la rotación.
  ============================================================================ -->
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js";
    import { crearCapaEsqueleto } from "./capa_esqueleto.js";
    import { crearCapaMusculo } from "./capa_musculo.js";
    import { crearCapaGrasa } from "./capa_grasa.js";
    import { crearCapaPiel } from "./capa_piel.js";

    const visorW = () => Math.max(300, visorEl.clientWidth || window.innerWidth - 380);
    const visorH = () => Math.max(300, visorEl.clientHeight || window.innerHeight);

    const escena = new THREE.Scene();
    const camara = new THREE.PerspectiveCamera(42, visorW() / visorH(), 0.1, 100);
    const renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    // ToneMapping para PBR realista (evita que los blancos quemen la piel o el hueso)
    renderizador.setSize(visorW(), visorH());
    renderizador.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderizador.shadowMap.enabled = true;
    renderizador.toneMapping = THREE.ACESFilmicToneMapping;
    renderizador.toneMappingExposure = 1.1;
    visorEl.appendChild(renderizador.domElement);

    // Sistema de iluminación fotométrica de 3 puntos
    escena.add(new THREE.AmbientLight(0xffffff, 0.6));
    const luzPrincipal = new THREE.DirectionalLight(0xffffff, 1.8);
    luzPrincipal.position.set(2.5, 4, 3);
    luzPrincipal.castShadow = true;
    escena.add(luzPrincipal);
    const luzRelleno = new THREE.DirectionalLight(0x5eead4, 0.5);
    luzRelleno.position.set(-3, 2, -2);
    escena.add(luzRelleno);

    // ============================================================================
    // [BLOQUE 5] CARGA Y SINCRONIZACIÓN DE LAS CAPAS
    // Función: Instancia los 4 módulos (Esqueleto, Músculo, Grasa, Piel), los
    // inyecta a la escena y propaga los parámetros del HUD hacia todas las capas.
    // ============================================================================
    const avatarRaiz = new THREE.Group();
    escena.add(avatarRaiz);

    const capaEsqueleto = crearCapaEsqueleto();
    const capaMusculo = crearCapaMusculo();
    const capaGrasa = crearCapaGrasa();
    const capaPiel = crearCapaPiel();

    avatarRaiz.add(capaEsqueleto.group, capaMusculo.group, capaGrasa.group, capaPiel.group);

    const capas = {
      esqueleto: capaEsqueleto,
      musculo: capaMusculo,
      grasa: capaGrasa,
      piel: capaPiel
    };

    // Propaga parámetros y anclajes mundiales a cada módulo para que el músculo/grasa sigan al esqueleto
    window.aplicarCambios = aplicarCambios = () => {
      try {
        const p = leerParametros();
        Object.entries(visibilidad).forEach(([clave, activa]) => {
          capas[clave].group.visible = activa;
        });

        // El esqueleto computa sus matrices primero
        capaEsqueleto.actualizar(p);
        
        // Las capas blandas reciben los anclajes (coordenadas mundiales de las articulaciones)
        const contexto = { ...p, anclajes: capaEsqueleto.anclajes };
        capaMusculo.actualizar(contexto);
        capaGrasa.actualizar(contexto);
        capaPiel.actualizar(contexto);
      } catch (err) {
        mostrarError(err.message || String(err));
      }
    };

    // ============================================================================
    // [BLOQUE 6] CICLO DE RENDER Y CONTROLES DE CÁMARA
    // Función: Bucle de animación nativo de RequestAnimationFrame y controles
    // orbitales (rotación, zoom) personalizados sin librerías externas.
    // ============================================================================
    let arrastrando = false;
    let prevX = 0, prevY = 0;
    let rotY = 0, rotX = 0.12, distancia = 3.5;

    function actualizarCamara() {
      const yObjetivo = 0.95; // Apunta al pecho/cuello
      camara.position.x = distancia * Math.sin(rotY) * Math.cos(rotX);
      camara.position.y = yObjetivo + distancia * Math.sin(rotX);
      camara.position.z = distancia * Math.cos(rotY) * Math.cos(rotX);
      camara.lookAt(0, yObjetivo, 0);
    }

    renderizador.domElement.addEventListener("pointerdown", (e) => {
      arrastrando = true; prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener("pointerup", () => arrastrando = false);
    window.addEventListener("pointermove", (e) => {
      if (!arrastrando) return;
      rotY += (e.clientX - prevX) * 0.008;
      rotX = THREE.MathUtils.clamp(rotX + (e.clientY - prevY) * 0.006, -0.6, 0.9);
      prevX = e.clientX; prevY = e.clientY;
      actualizarCamara();
    });

    renderizador.domElement.addEventListener("wheel", (e) => {
      e.preventDefault();
      distancia = THREE.MathUtils.clamp(distancia + e.deltaY * 0.0018, 1.0, 6.0);
      actualizarCamara();
    }, { passive: false });

    window.addEventListener("resize", () => {
      camara.aspect = visorW() / visorH();
      camara.updateProjectionMatrix();
      renderizador.setSize(visorW(), visorH());
    });

    aplicarCambios();
    actualizarCamara();

    function bucleAnimacion() {
      requestAnimationFrame(bucleAnimacion);
      renderizador.render(escena, camara);
    }
    bucleAnimacion();
  </script>
</body>
</html>
