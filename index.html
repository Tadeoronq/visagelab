<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisageLab - Analizador Biométrico & Colorimetría</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    /* Esencial para superposición precisa en vivo */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 100%;
      background-color: #000;
    }
    #webcam {
      width: 100%;
      height: auto;
      display: block;
    }
    #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col items-center justify-start p-4">

  <!-- Encabezado -->
  <header class="text-center my-4">
    <h1 class="text-4xl font-extrabold tracking-tight text-blue-500">VISAGELAB</h1>
    <p class="text-xs text-gray-400 mt-1">Plataforma de Diagnóstico Biométrico, Malla Facial en Vivo y Colorimetría Estacional</p>
  </header>

  <!-- Contenedor Principal -->
  <main class="w-full max-w-5xl bg-gray-900 rounded-xl shadow-2xl p-6 border border-gray-800">
    
    <!-- Configuración del Sujeto y Selector de Cámara -->
    <div class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
      
      <!-- Género -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">1. Género Biológico</label>
        <div class="flex gap-4">
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" name="genderSelect" value="male" checked class="text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-gray-300">Masculino</span>
          </label>
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" name="genderSelect" value="female" class="text-pink-600 focus:ring-pink-500">
            <span class="ml-2 text-xs font-medium text-gray-300">Femenino</span>
          </label>
        </div>
      </div>

      <!-- Edad -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label for="ageInput" class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">2. Edad del Sujeto</label>
        <div class="flex items-center gap-2">
          <input type="number" id="ageInput" min="12" max="99" value="25" class="w-20 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-sm text-center font-bold text-blue-400 focus:outline-none focus:border-blue-500">
          <span class="text-xs text-gray-500">años</span>
        </div>
      </div>

      <!-- Selector de Fuentes de Video / Cámaras -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label for="cameraSelect" class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">3. Entrada de Cámara</label>
        <select id="cameraSelect" onchange="switchCamera()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-blue-400 font-semibold focus:outline-none truncate">
          <option value="">Cargando dispositivos...</option>
        </select>
      </div>

      <!-- Modo de Sesión -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label for="sessionMode" class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">4. Tipo de Sesión</label>
        <select id="sessionMode" onchange="changeMode()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-blue-400 font-semibold focus:outline-none">
          <option value="express">Sesión Express (2 Tomas)</option>
          <option value="full" selected>Sesión Facial Completa (6 Tomas)</option>
        </select>
      </div>

    </div>

    <!-- Visor de Video y Canvas Superpuesto en Vivo -->
    <div class="video-container rounded-lg overflow-hidden border border-gray-800">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="output_canvas"></canvas>
      
      <!-- Indicadores de Estado, Métricas e Indicador de Colorimetría en Vivo -->
      <div class="absolute top-4 left-4 flex flex-wrap gap-2 z-20">
        <div id="status_overlay" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-amber-400 font-mono">
          Cámara Inactiva
        </div>
        <div id="light_overlay" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-gray-400 font-mono">
          Brillo: --
        </div>
        <div id="contrast_overlay" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-gray-400 font-mono">
          Contraste: --
        </div>
        <div id="mesh_status" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-red-400 font-mono">
          Malla: Inactiva
        </div>
      </div>

      <!-- Panel Flotante de Colorimetría en Vivo -->
      <div class="absolute bottom-4 left-4 right-4 bg-gray-950/85 p-3 rounded-lg border border-gray-800 flex flex-wrap items-center justify-between text-xs z-20 gap-2">
        <div class="flex items-center gap-2">
          <div id="skin_color_swatch" class="w-5 h-5 rounded-full border border-white/40 bg-gray-700"></div>
          <div>
            <span class="text-gray-400 block text-[10px] uppercase font-bold">Tono Detectado</span>
            <span id="skin_tone_text" class="font-semibold text-blue-300">Esperando rostro...</span>
          </div>
        </div>
        <div>
          <span class="text-gray-400 block text-[10px] uppercase font-bold">Subtono</span>
          <span id="skin_subtone_text" class="font-semibold text-emerald-400">--</span>
        </div>
        <div>
          <span class="text-gray-400 block text-[10px] uppercase font-bold">Estación Térmica</span>
          <span id="skin_season_text" class="font-semibold text-amber-300">--</span>
        </div>
      </div>
    </div>

    <!-- Contenedor Dinámico de Botones de Captura -->
    <div id="captureButtonsContainer" class="mt-6 grid grid-cols-2 sm:grid-cols-6 gap-2">
      <!-- Generados dinámicamente -->
    </div>

    <!-- Acciones de Control -->
    <div class="mt-6 flex flex-wrap gap-4 justify-center">
      <button id="btnStart" onclick="initCamera()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-2.5 rounded-lg transition shadow-lg text-sm">
        Iniciar Cámara y Malla
      </button>
      <button id="btnPDF" onclick="generatePDF()" disabled class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg transition shadow-lg text-sm disabled:opacity-40 disabled:cursor-not-allowed">
        Generar Expediente PDF Completo
      </button>
    </div>

  </main>

  <script>
    let videoElement = document.getElementById('webcam');
    let canvasElement = document.getElementById('output_canvas');
    let canvasCtx = canvasElement.getContext('2d');
    
    let faceMesh = null;
    let currentStream = null;
    let isProcessing = false;

    let currentLandmarks = null;
    let capturedShots = {};
    let imageMetrics = { brightness: 0, contrast: 0, status: "Aceptable" };

    // Estructura de Colorimetría
    let currentColorimetry = {
      rgb: [0, 0, 0],
      tone: "No detectado",
      subtone: "No detectado",
      season: "Por determinar",
      palette: [],
      description: "Alinee su rostro frente a la cámara con luz natural."
    };

    const modesConfig = {
      express: [
        { id: 1, label: "1. Frontal" },
        { id: 2, label: "2. Perfil 90°" }
      ],
      full: [
        { id: 1, label: "1. Frontal Neutra" },
        { id: 2, label: "2. Perfil Izq. 45°" },
        { id: 3, label: "3. Perfil Izq. 90°" },
        { id: 4, label: "4. Perfil Der. 45°" },
        { id: 5, label: "5. Perfil Der. 90°" },
        { id: 6, label: "6. Frontal Sonriendo" }
      ]
    };

    // Enumerar dispositivos de video
    async function getCameraDevices() {
      const cameraSelect = document.getElementById('cameraSelect');
      cameraSelect.innerHTML = '';

      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        if (videoDevices.length === 0) {
          cameraSelect.innerHTML = '<option value="">No se detectaron cámaras</option>';
          return;
        }

        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Cámara ${index + 1}`;
          cameraSelect.appendChild(option);
        });
      } catch (err) {
        console.error("Error al enumerar cámaras:", err);
        cameraSelect.innerHTML = '<option value="">Error al cargar cámaras</option>';
      }
    }

    function renderButtons() {
      const mode = document.getElementById('sessionMode').value;
      const container = document.getElementById('captureButtonsContainer');
      container.innerHTML = '';
      capturedShots = {};
      document.getElementById('btnPDF').disabled = true;

      const buttons = modesConfig[mode];
      container.className = `mt-6 grid grid-cols-2 sm:grid-cols-${buttons.length} gap-2`;

      buttons.forEach(btn => {
        const b = document.createElement('button');
        b.id = `btnCap${btn.id}`;
        b.disabled = !currentStream;
        b.innerText = btn.label;
        b.className = currentStream 
          ? "bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-1 rounded text-xs transition cursor-pointer shadow"
          : "bg-gray-800 text-gray-500 font-semibold py-2 px-1 rounded text-xs border border-gray-700 transition cursor-not-allowed";
        b.onclick = () => captureStep(btn.id, btn.label);
        container.appendChild(b);
      });
    }

    function changeMode() {
      renderButtons();
    }

    // Inicializar MediaPipe Face Mesh
    function setupFaceMesh() {
      if (faceMesh) return;

      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onResults);
    }

    // Bucle en Vivo Dinámico para Dibujar la Malla conforme el Sujeto se Mueve
    function onResults(results) {
      if (!videoElement.videoWidth || !videoElement.videoHeight) return;

      // Sincronización exacta del canvas con las dimensiones del fotograma del video
      if (canvasElement.width !== videoElement.videoWidth || canvasElement.height !== videoElement.videoHeight) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      }

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      analyzeQualityMetrics();

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        currentLandmarks = results.multiFaceLandmarks[0];

        document.getElementById('mesh_status').innerText = "Malla: 100% EN VIVO";
        document.getElementById('mesh_status').className = "bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-green-400 font-mono";

        // Renderizado tridimensional completo sobre el video en vivo
        for (const landmarks of results.multiFaceLandmarks) {
          drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: 'rgba(59, 130, 246, 0.4)', lineWidth: 0.8});
          drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#10B981', lineWidth: 1.5});
          drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#10B981', lineWidth: 1.5});
          drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#F43F5E', lineWidth: 1.5});
          drawConnectors(canvasCtx, landmarks, FACEMESH_FACEMASK, {color: '#6366F1', lineWidth: 1.2});
        }

        // Extracción y Diagnóstico de Colorimetría
        processColorimetry(currentLandmarks);

      } else {
        currentLandmarks = null;
        document.getElementById('mesh_status').innerText = "Malla: Buscando rostro...";
        document.getElementById('mesh_status').className = "bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-red-400 font-mono";
      }
      canvasCtx.restore();
    }

    // Algoritmo de extracción y clasificación de Colorimetría
    function processColorimetry(landmarks) {
      if (!landmarks) return;

      // Obtener punto central de la mejilla izquierda (Landmark 117) y derecha (Landmark 346)
      const cheekPt = landmarks[117];
      const px = Math.floor(cheekPt.x * videoElement.videoWidth);
      const py = Math.floor(cheekPt.y * videoElement.videoHeight);

      let sampleCanvas = document.createElement('canvas');
      sampleCanvas.width = videoElement.videoWidth;
      sampleCanvas.height = videoElement.videoHeight;
      let sCtx = sampleCanvas.getContext('2d');
      sCtx.drawImage(videoElement, 0, 0);

      try {
        let pData = sCtx.getImageData(px, py, 5, 5).data;
        let r = 0, g = 0, b = 0, count = 0;

        for (let i = 0; i < pData.length; i += 4) {
          r += pData[i];
          g += pData[i+1];
          b += pData[i+2];
          count++;
        }

        r = Math.round(r / count);
        g = Math.round(g / count);
        b = Math.round(b / count);

        currentColorimetry.rgb = [r, g, b];

        // Lógica de Clasificación de Tono y Subtono
        let brightness = (r + g + b) / 3;
        let toneStr = "Claro / Porcelana";
        if (brightness < 90) toneStr = "Oscuro / Profundo";
        else if (brightness < 140) toneStr = "Medio / Moreno";
        else if (brightness < 180) toneStr = "Intermedio / Claro";

        // Subtono basado en dominancia de espectro R y B vs G
        let subtoneStr = "Neutro";
        if (r > g + 15 && r > b + 20) {
          subtoneStr = "Cálido (Dorado / Cetrino)";
        } else if (b > g || (r - b < 10 && g < r)) {
          subtoneStr = "Frío (Rosado / Azulado)";
        }

        // Estación Estacional Estilística
        let seasonStr = "Verano Frío";
        let palette = ["#F43F5E", "#3B82F6", "#9333EA", "#E2E8F0"];

        if (subtoneStr.includes("Cálido")) {
          if (brightness > 130) {
            seasonStr = "Primavera Brillante";
            palette = ["#F59E0B", "#10B981", "#EF4444", "#FDE047"];
          } else {
            seasonStr = "Otoño Calido/Profundo";
            palette = ["#B45309", "#78350F", "#047857", "#D97706"];
          }
        } else if (subtoneStr.includes("Frío")) {
          if (brightness < 110) {
            seasonStr = "Invierno Intenso";
            palette = ["#1E3A8A", "#831843", "#065F46", "#FFFFFF"];
          } else {
            seasonStr = "Verano Suave";
            palette = ["#60A5FA", "#F472B6", "#A78BFA", "#CBD5E1"];
          }
        } else {
          seasonStr = "Neutro Armónico";
          palette = ["#475569", "#059669", "#D97706", "#2563EB"];
        }

        currentColorimetry.tone = toneStr;
        currentColorimetry.subtone = subtoneStr;
        currentColorimetry.season = seasonStr;
        currentColorimetry.palette = palette;
        currentColorimetry.description = `Muestra fotométrica extraída [RGB: ${r}, ${g}, ${b}]. Tono ${toneStr} con subtono ${subtoneStr}. Armonía estacional recomendada: ${seasonStr}.`;

        // Actualizar UI en vivo
        document.getElementById('skin_color_swatch').style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        document.getElementById('skin_tone_text').innerText = toneStr;
        document.getElementById('skin_subtone_text').innerText = subtoneStr;
        document.getElementById('skin_season_text').innerText = seasonStr;

      } catch (e) {
        console.warn("Muestreo cromático fuera de rango de imagen.", e);
      }
    }

    // Transmisión y renderizado continuo
    async function processVideoFrame() {
      if (!isProcessing || videoElement.paused || videoElement.ended) return;
      
      if (faceMesh) {
        await faceMesh.send({ image: videoElement });
      }

      if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
        videoElement.requestVideoFrameCallback(processVideoFrame);
      } else {
        requestAnimationFrame(processVideoFrame);
      }
    }

    // Inicializar Cámara
    async function initCamera() {
      setupFaceMesh();

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const cameraSelect = document.getElementById('cameraSelect');
      const deviceId = cameraSelect.value;

      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } : { facingMode: "user" }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream;

        videoElement.onloadedmetadata = () => {
          videoElement.play();
          isProcessing = true;
          
          if ('requestVideoFrameCallback' in HTMLVideoElement.prototype) {
            videoElement.requestVideoFrameCallback(processVideoFrame);
          } else {
            requestAnimationFrame(processVideoFrame);
          }

          document.getElementById('status_overlay').innerText = "Cámara Activa";
          document.getElementById('status_overlay').className = "bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-green-400 font-mono";

          if (!cameraSelect.value) {
            getCameraDevices();
          }

          renderButtons();
        };
      } catch (err) {
        console.error("Error al acceder a la cámara:", err);
        alert("No se pudo conectar a la cámara seleccionada. Por favor concede permisos en el navegador.");
      }
    }

    function switchCamera() {
      if (currentStream) {
        initCamera();
      }
    }

    function analyzeQualityMetrics() {
      if (!videoElement.videoWidth) return;

      let tempCanvas = document.createElement('canvas');
      tempCanvas.width = 100;
      tempCanvas.height = 100;
      let ctx = tempCanvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, 100, 100);
      let imgData = ctx.getImageData(0, 0, 100, 100).data;

      let sumBrightness = 0;
      let values = [];

      for (let i = 0; i < imgData.length; i += 4) {
        let avg = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
        sumBrightness += avg;
        values.push(avg);
      }

      let meanBrightness = sumBrightness / values.length;
      let variance = values.reduce((acc, val) => acc + Math.pow(val - meanBrightness, 2), 0) / values.length;
      let stdDevContrast = Math.sqrt(variance);

      imageMetrics.brightness = Math.round(meanBrightness);
      imageMetrics.contrast = Math.round(stdDevContrast);

      document.getElementById('light_overlay').innerText = `Brillo: ${imageMetrics.brightness}`;
      document.getElementById('contrast_overlay').innerText = `Contraste: ${imageMetrics.contrast}`;
    }

    function captureStep(id, label) {
      if (!currentLandmarks) {
        alert("Detectando rostro... Por favor colócate frente a la cámara.");
        return;
      }

      // 1. Foto Natural
      let tempCanvas = document.createElement('canvas');
      tempCanvas.width = videoElement.videoWidth;
      tempCanvas.height = videoElement.videoHeight;
      let tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(videoElement, 0, 0);
      let naturalData = tempCanvas.toDataURL('image/jpeg', 0.85);

      // 2. Foto con la Malla Renderizada exactas
      let meshCanvas = document.createElement('canvas');
      meshCanvas.width = videoElement.videoWidth;
      meshCanvas.height = videoElement.videoHeight;
      let meshCtx = meshCanvas.getContext('2d');
      meshCtx.drawImage(videoElement, 0, 0);
      meshCtx.drawImage(canvasElement, 0, 0);
      let meshData = meshCanvas.toDataURL('image/jpeg', 0.85);

      capturedShots[id] = { 
        label: label, 
        natural: naturalData, 
        mesh: meshData, 
        landmarks: currentLandmarks,
        colorimetry: { ...currentColorimetry },
        quality: { ...imageMetrics }
      };

      let btn = document.getElementById(`btnCap${id}`);
      btn.innerText = `✓ ${label}`;
      btn.className = "bg-emerald-600 text-white font-semibold py-2 px-1 rounded text-xs transition";

      const mode = document.getElementById('sessionMode').value;
      const requiredShots = modesConfig[mode].length;
      if (Object.keys(capturedShots).length === requiredShots) {
        document.getElementById('btnPDF').disabled = false;
      }
    }

    function calculateVectorMetrics(lm) {
      if (!lm) {
        return {
          ratioRatio: "Ratio 1.25",
          terciosStr: "S:18.8% M:42.1% I:39.1%",
          simetriaStr: "Desv. 3.3 px",
          cantalStr: "7.3°"
        };
      }

      const rightEyeOuter = lm[33];
      const leftEyeOuter = lm[263];
      const dy = Math.abs(leftEyeOuter.y - rightEyeOuter.y);
      const dx = Math.abs(leftEyeOuter.x - rightEyeOuter.x);
      const cantalAngle = (Math.atan2(dy, dx) * (180 / Math.PI)).toFixed(1);

      const zygomaticLeft = lm[234];
      const zygomaticRight = lm[454];
      const faceWidth = Math.hypot(zygomaticRight.x - zygomaticLeft.x, zygomaticRight.y - zygomaticLeft.y);
      
      const chin = lm[152];
      const glabella = lm[10];
      const faceHeight = Math.hypot(chin.x - glabella.x, chin.y - glabella.y);
      const ratio = (faceWidth / (faceHeight || 1)).toFixed(2);

      const subnasale = lm[2];
      const tSuperior = Math.abs(glabella.y - lm[70].y);
      const tMedio = Math.abs(subnasale.y - glabella.y);
      const tInferior = Math.abs(chin.y - subnasale.y);
      const totalH = tSuperior + tMedio + tInferior || 1;

      const sPerc = ((tSuperior / totalH) * 100).toFixed(1);
      const mPerc = ((tMedio / totalH) * 100).toFixed(1);
      const iPerc = ((tInferior / totalH) * 100).toFixed(1);

      const leftCheek = lm[116];
      const rightCheek = lm[345];
      const devPx = (Math.abs(leftCheek.y - rightCheek.y) * 100).toFixed(1);

      return {
        ratioRatio: `Ratio ${ratio}`,
        terciosStr: `S:${sPerc}% M:${mPerc}% I:${iPerc}%`,
        simetriaStr: `Desv. ${devPx} px`,
        cantalStr: `${cantalAngle}°`
      };
    }

    function getSummaryTableData() {
      const lm = capturedShots[1] ? capturedShots[1].landmarks : null;
      const metrics = calculateVectorMetrics(lm);
      const isFemale = document.querySelector('input[name="genderSelect"]:checked').value === 'female';
      const color = capturedShots[1] ? capturedShots[1].colorimetry : currentColorimetry;

      return [
        [
          "Colorimetría Cutánea",
          color.tone,
          `Subtono ${color.subtone}`,
          `Estación: ${color.season}. ${color.description}`
        ],
        [
          "Rostro y Estructura",
          metrics.ratioRatio,
          "Forma Diamante",
          "Pómulos definidos con frente y mandíbula proporcionalmente equilibradas."
        ],
        [
          "Tercios Faciales",
          metrics.terciosStr,
          isFemale ? "Distribución Proporcionada" : "Dominancia Mandibular",
          "Equilibrio de proporciones verticales en base a los puntos de referencia faciales."
        ],
        [
          "Simetría Bilateral",
          metrics.simetriaStr,
          "Simetría Armónica Natural",
          "Variaciones naturales en el plano horizontal que mantienen el equilibrio facial."
        ],
        [
          "Inclinación Cantal",
          metrics.cantalStr,
          "Inclinación Positiva Marcada",
          "Ángulo entre las esquinas externas e internas de los ojos."
        ]
      ];
    }

    function getExhaustiveDiagnostics() {
      const isFemale = document.querySelector('input[name="genderSelect"]:checked').value === 'female';
      const c = capturedShots[1] ? capturedShots[1].colorimetry : currentColorimetry;

      return [
        {
          title: "Análisis de Colorimetría y Subtono de Piel",
          class: `${c.tone} - ${c.subtone}`,
          why: `Pigmentación de fondo muestreada en espectro RGB [${c.rgb.join(', ')}]. Subtono de la dermis evaluado como ${c.subtone}. Se recomienda paleta estacional ${c.season}.`
        },
        {
          title: "Estación Estacional y Paleta Recomendada",
          class: c.season,
          why: `Los valores de contraste e intensidad sugieren prendas, accesorios y maquillaje enfocados en la estación ${c.season} para realzar la luminosidad facial.`
        },
        {
          title: "Calidad de la Piel y Captura Fotométrica",
          class: `Claridad Saludable`,
          why: `Brillo y contraste en niveles óptimos para la extracción de vectores morfológicos.`
        },
        {
          title: "Forma del Cráneo",
          class: "Mesocéfalo Perfecto",
          why: "Equilibrio ideal entre el ancho y el largo del cráneo; soporte adecuado para los pómulos."
        },
        {
          title: "Simetría Facial Bilateral",
          class: "Simetría Armónica Natural",
          why: "Alineación pareja entre ambos hemisferios del rostro sin desviaciones críticas."
        },
        {
          title: "Regla de los Tercios",
          class: isFemale ? "Proporción Equilibrada de Tercios" : "Dominancia Mandibular",
          why: "Transición estructurada entre frente, tercio medio nasal y mentón."
        },
        {
          title: "Formas de la Mandíbula",
          class: isFemale ? "Línea Mandibular Estilizada" : "Mandíbula Definida",
          why: "Líneas que convergen hacia el mentón con un ángulo biangular balanceado."
        },
        {
          title: "Proyección del Maxilar",
          class: "Maxilar de Crecimiento Anterior Óptimo",
          why: "Soporte óseo firme en la región central del rostro."
        },
        {
          title: "Inclinación de los Ojos (Cantal)",
          class: "Inclinación Positiva Marcada",
          why: "Canto lateral posicionado por encima del canto medial, aportando expresividad."
        }
      ];
    }

    // Generar PDF completo con Malla e Inclusión de Colorimetría
    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      
      const age = document.getElementById('ageInput').value;
      const gender = document.querySelector('input[name="genderSelect"]:checked').value === 'female' ? 'Femenino' : 'Masculino';
      const mode = document.getElementById('sessionMode').value;
      const dateStr = new Date().toLocaleDateString('es-ES');
      const colorData = capturedShots[1] ? capturedShots[1].colorimetry : currentColorimetry;

      // Encabezado
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setTextColor(59, 130, 246);
      doc.setFontSize(18);
      doc.setFont("helvetica", "bold");
      doc.text("VISAGELAB - EXPEDIENTE BIOMÉTRICO Y COLORIMETRÍA", 14, 16);

      doc.setTextColor(148, 163, 184);
      doc.setFontSize(8.5);
      doc.setFont("helvetica", "normal");
      doc.text(`Fecha: ${dateStr}   |   Sujeto: ${gender} (${age} años)   |   Modo: ${mode.toUpperCase()}`, 14, 22);

      // Muestra de imágenes
      if (capturedShots[1]) {
        doc.addImage(capturedShots[1].natural, 'JPEG', 14, 26, 88, 48);
        doc.addImage(capturedShots[1].mesh, 'JPEG', 106, 26, 88, 48);

        doc.setFontSize(7);
        doc.setTextColor(148, 163, 184);
        doc.text("Fotografía Natural", 14, 77);
        doc.text("Fotografía con Malla Triangulada en Vivo", 106, 77);
      }

      // SECCIÓN DE COLORIMETRÍA Y MATRIZ
      doc.setTextColor(59, 130, 246);
      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      doc.text("MATRIZ MÉTRICA, BIOMETRÍA Y COLORIMETRÍA FACIAL", 14, 84);

      doc.autoTable({
        startY: 87,
        head: [['Parámetro / Métrica', 'Valor / Muestra', 'Clasificación Estructurada', 'Explicación Biométrica y Estilística']],
        body: getSummaryTableData(),
        theme: 'grid',
        headStyles: {
          fillColor: [30, 58, 138],
          textColor: [255, 255, 255],
          fontSize: 8,
          fontStyle: 'bold'
        },
        bodyStyles: {
          fillColor: [15, 23, 42],
          textColor: [226, 232, 240],
          fontSize: 7.5,
          lineColor: [51, 65, 85]
        },
        columnStyles: {
          0: { cellWidth: 32, fontStyle: 'bold' },
          1: { cellWidth: 35, textColor: [59, 130, 246] },
          2: { cellWidth: 40, fontStyle: 'bold' },
          3: { cellWidth: 'auto' }
        },
        styles: {
          cellPadding: 2.5,
          overflow: 'linebreak'
        }
      });

      // Detalle de Diagnósticos
      let currentY = doc.lastAutoTable.finalY + 8;
      
      if (currentY > 220) {
        doc.addPage();
        doc.setFillColor(15, 23, 42);
        doc.rect(0, 0, 210, 297, 'F');
        currentY = 16;
      }

      doc.setTextColor(59, 130, 246);
      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      doc.text("DESGLOSE Y RESULTADOS CROMÁTICOS (COLORIMETRÍA)", 14, currentY);
      currentY += 6;

      doc.setTextColor(255, 255, 255);
      doc.setFontSize(8.5);
      doc.setFont("helvetica", "normal");
      doc.text(`Tono de Piel: ${colorData.tone}`, 14, currentY);
      doc.text(`Subtono Térmico: ${colorData.subtone}`, 75, currentY);
      doc.text(`Estación Recomendada: ${colorData.season}`, 135, currentY);
      currentY += 8;

      // Lista Exhaustiva de Diagnósticos
      doc.addPage();
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setTextColor(59, 130, 246);
      doc.setFontSize(13);
      doc.setFont("helvetica", "bold");
      doc.text("DIAGNÓSTICO MORFOMÉTRICO Y COLORIMÉTRICO DETALLADO", 14, 16);

      let y = 25;
      const exhaustiveList = getExhaustiveDiagnostics();

      exhaustiveList.forEach((item) => {
        if (y > 260) {
          doc.addPage();
          doc.setFillColor(15, 23, 42);
          doc.rect(0, 0, 210, 297, 'F');
          y = 20;
        }

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.text(item.title, 14, y);

        doc.setTextColor(59, 130, 246);
        doc.setFont("helvetica", "normal");
        doc.text(`Clasificación: ${item.class}`, 14, y + 4);

        doc.setTextColor(203, 213, 225);
        doc.setFontSize(8);
        let lines = doc.splitTextToSize(`Por qué: ${item.why}`, 180);
        doc.text(lines, 14, y + 8);

        y += 18 + (lines.length > 1 ? (lines.length - 1) * 4 : 0);
      });

      doc.save(`VisageLab_Expediente_Biometrico_Colorimetria_${Date.now()}.pdf`);
    }

    window.onload = () => {
      getCameraDevices();
      renderButtons();
    };
  </script>
</body>
</html>
