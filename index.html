<!-- Visor de Video con Proporción Nativa (Sustituir en index.html) -->
<section class="lg:col-span-2 bg-slate-900 rounded-xl p-4 border border-slate-800 flex flex-col items-center justify-center relative">
  
  <div class="canvas-container shadow-2xl border border-slate-800">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <!-- Botón de Captura Fotográfica -->
  <div class="mt-4 flex justify-center items-center w-full gap-4">
    <button id="btnCapture" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-emerald-900/30 transition-all flex items-center gap-2">
      <span>📸 Capturar Foto (<span id="captureStepText">Frontal</span>)</span>
    </button>
  </div>

  <!-- Panel Semáforo de Calidad -->
  <div class="w-full mt-4 bg-slate-950 p-3 rounded-lg border border-slate-800 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
    <div id="status-light" class="flex items-center gap-2 p-1.5 rounded bg-slate-900 border border-slate-800">
      <span class="w-2.5 h-2.5 rounded-full bg-slate-600" id="dot-light"></span>
      <span class="text-slate-300">Luz / Iluminación</span>
    </div>
    <div id="status-contrast" class="flex items-center gap-2 p-1.5 rounded bg-slate-900 border border-slate-800">
      <span class="w-2.5 h-2.5 rounded-full bg-slate-600" id="dot-contrast"></span>
      <span class="text-slate-300">Contraste Fondo</span>
    </div>
    <div id="status-pose" class="flex items-center gap-2 p-1.5 rounded bg-slate-900 border border-slate-800">
      <span class="w-2.5 h-2.5 rounded-full bg-slate-600" id="dot-pose"></span>
      <span class="text-slate-300">Inclinación Cabeza</span>
    </div>
    <div id="status-quality" class="flex items-center gap-2 p-1.5 rounded bg-slate-900 border border-slate-800">
      <span class="w-2.5 h-2.5 rounded-full bg-slate-600" id="dot-quality"></span>
      <span class="text-slate-300">Calidad Foto</span>
    </div>
  </div>
</section>
