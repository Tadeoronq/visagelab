<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisageLab - Analizador Biométrico</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans flex flex-col items-center justify-start p-4">

  <!-- Encabezado -->
  <header class="text-center my-4">
    <h1 class="text-4xl font-extrabold tracking-tight text-blue-500">VISAGELAB</h1>
    <p class="text-xs text-gray-400 mt-1">Plataforma Privada de Diagnóstico Biométrico Facial y Corporal</p>
  </header>

  <!-- Contenedor Principal -->
  <main class="w-full max-w-5xl bg-gray-900 rounded-xl shadow-2xl p-6 border border-gray-800">
    
    <!-- Configuración del Sujeto y Selector de Cámara -->
    <div class="mb-6 grid grid-cols-1 md:grid-cols-4 gap-4">
      
      <!-- Género -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">1. Género Biológico</label>
        <div class="flex gap-4">
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" name="genderSelect" value="male" checked class="text-blue-600 focus:ring-blue-500">
            <span class="ml-2 text-xs font-medium text-gray-300">Masculino</span>
          </label>
          <label class="inline-flex items-center cursor-pointer">
            <input type="radio" name="genderSelect" value="female" class="text-pink-600 focus:ring-pink-500">
            <span class="ml-2 text-xs font-medium text-gray-300">Femenino</span>
          </label>
        </div>
      </div>

      <!-- Edad -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label for="ageInput" class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">2. Edad del Sujeto</label>
        <div class="flex items-center gap-2">
          <input type="number" id="ageInput" min="12" max="99" value="25" class="w-20 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-sm text-center font-bold text-blue-400 focus:outline-none focus:border-blue-500">
          <span class="text-xs text-gray-500">años</span>
        </div>
      </div>

      <!-- Selector de Fuentes de Video / Cámaras -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label for="cameraSelect" class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">3. Entrada de Cámara</label>
        <select id="cameraSelect" onchange="switchCamera()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-blue-400 font-semibold focus:outline-none truncate">
          <option value="">Cargando dispositivos...</option>
        </select>
      </div>

      <!-- Modo de Sesión -->
      <div class="bg-gray-950 p-3 rounded-md border border-gray-800 flex flex-col justify-between">
        <label for="sessionMode" class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">4. Tipo de Sesión</label>
        <select id="sessionMode" onchange="changeMode()" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-blue-400 font-semibold focus:outline-none">
          <option value="express">Sesión Express (2 Tomas)</option>
          <option value="full" selected>Sesión Facial Completa (6 Tomas)</option>
          <option value="body">Sesión Corporal (Próximamente)</option>
        </select>
      </div>

    </div>

    <!-- Visor de Video y Canvas para Malla Facial en Vivo -->
    <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-gray-800 flex items-center justify-center">
      <video id="webcam" class="absolute inset-0 w-full h-full object-contain" autoplay playsinline muted></video>
      <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-contain pointer-events-none z-10"></canvas>
      
      <!-- Indicadores de Estado y Métricas de Imagen en Vivo -->
      <div class="absolute top-4 left-4 flex flex-wrap gap-2 z-20">
        <div id="status_overlay" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-amber-400 font-mono">
          Cámara Inactiva
        </div>
        <div id="light_overlay" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-gray-400 font-mono">
          Brillo: --
        </div>
        <div id="contrast_overlay" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-gray-400 font-mono">
          Contraste: --
        </div>
        <div id="mesh_status" class="bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-red-400 font-mono">
          Malla: No detectada
        </div>
      </div>
    </div>

    <!-- Contenedor Dinámico de Botones de Captura -->
    <div id="captureButtonsContainer" class="mt-6 grid grid-cols-2 sm:grid-cols-6 gap-2">
      <!-- Generados dinámicamente -->
    </div>

    <!-- Acciones de Control -->
    <div class="mt-6 flex flex-wrap gap-4 justify-center">
      <button id="btnStart" onclick="initCamera()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-2.5 rounded-lg transition shadow-lg text-sm">
        Iniciar Cámara
      </button>
      <button id="btnPDF" onclick="generatePDF()" disabled class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2.5 rounded-lg transition shadow-lg text-sm disabled:opacity-40 disabled:cursor-not-allowed">
        Generar Expediente PDF
      </button>
    </div>

  </main>

  <script>
    let videoElement = document.getElementById('webcam');
    let canvasElement = document.getElementById('output_canvas');
    let canvasCtx = canvasElement.getContext('2d');
    
    let faceMesh = null;
    let currentStream = null;
    let isProcessing = false;

    let currentLandmarks = null;
    let capturedShots = {};
    let imageMetrics = { brightness: 0, contrast: 0, status: "Aceptable" };

    const modesConfig = {
      express: [
        { id: 1, label: "1. Frontal" },
        { id: 2, label: "2. Perfil 90°" }
      ],
      full: [
        { id: 1, label: "1. Frontal Neutra" },
        { id: 2, label: "2. Perfil Izq. 45°" },
        { id: 3, label: "3. Perfil Izq. 90°" },
        { id: 4, label: "4. Perfil Der. 45°" },
        { id: 5, label: "5. Perfil Der. 90°" },
        { id: 6, label: "6. Frontal Sonriendo" }
      ],
      body: [
        { id: 1, label: "Cuerpo Frontal" },
        { id: 2, label: "Cuerpo Perfil" }
      ]
    };

    // Enumerar cámaras disponibles (Frontal, Trasera, USB externas)
    async function getCameraDevices() {
      const cameraSelect = document.getElementById('cameraSelect');
      cameraSelect.innerHTML = '';

      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');

        if (videoDevices.length === 0) {
          cameraSelect.innerHTML = '<option value="">No se detectaron cámaras</option>';
          return;
        }

        videoDevices.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.text = device.label || `Cámara ${index + 1}`;
          cameraSelect.appendChild(option);
        });
      } catch (err) {
        console.error("Error al enumerar dispositivos:", err);
        cameraSelect.innerHTML = '<option value="">Error al cargar cámaras</option>';
      }
    }

    function renderButtons() {
      const mode = document.getElementById('sessionMode').value;
      const container = document.getElementById('captureButtonsContainer');
      container.innerHTML = '';
      capturedShots = {};
      document.getElementById('btnPDF').disabled = true;

      if (mode === 'body') {
        container.innerHTML = `<div class="col-span-full text-center py-3 text-xs text-amber-400 bg-gray-950 rounded border border-gray-800">
          Módulo Corporal en desarrollo. Selecciona Sesión Express o Completa para Diagnóstico Facial.
        </div>`;
        return;
      }

      const buttons = modesConfig[mode];
      container.className = `mt-6 grid grid-cols-2 sm:grid-cols-${buttons.length} gap-2`;

      buttons.forEach(btn => {
        const b = document.createElement('button');
        b.id = `btnCap${btn.id}`;
        b.disabled = !currentStream;
        b.innerText = btn.label;
        b.className = currentStream 
          ? "bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-1 rounded text-xs transition cursor-pointer shadow"
          : "bg-gray-800 text-gray-500 font-semibold py-2 px-1 rounded text-xs border border-gray-700 transition cursor-not-allowed";
        b.onclick = () => captureStep(btn.id, btn.label);
        container.appendChild(b);
      });
    }

    function changeMode() {
      renderButtons();
    }

    // Inicialización de MediaPipe FaceMesh
    function setupFaceMesh() {
      if (faceMesh) return;

      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onResults);
    }

    // Dibujo en tiempo real sobre Canvas
    function onResults(results) {
      if (!videoElement.videoWidth || !videoElement.videoHeight) return;

      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Evaluación del contraste y brillo
      analyzeQualityMetrics();

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        currentLandmarks = results.multiFaceLandmarks[0];

        document.getElementById('mesh_status').innerText = "Malla: ACTIVA";
        document.getElementById('mesh_status').className = "bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-green-400 font-mono";

        for (const landmarks of results.multiFaceLandmarks) {
          // Malla tridimensional facial completa
          drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#3B82F6', lineWidth: 0.8});
          drawConnectors(canvasCtx, landmarks, FACEMESH_RIGHT_EYE, {color: '#10B981', lineWidth: 1.5});
          drawConnectors(canvasCtx, landmarks, FACEMESH_LEFT_EYE, {color: '#10B981', lineWidth: 1.5});
          drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#F43F5E', lineWidth: 1.5});
          drawConnectors(canvasCtx, landmarks, FACEMESH_FACEMASK, {color: '#6366F1', lineWidth: 1.0});
        }
      } else {
        currentLandmarks = null;
        document.getElementById('mesh_status').innerText = "Malla: No detectada";
        document.getElementById('mesh_status').className = "bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-red-400 font-mono";
      }
      canvasCtx.restore();
    }

    // Procesamiento fotograma a fotograma
    async function processVideoFrame() {
      if (!isProcessing || videoElement.paused || videoElement.ended) return;
      if (faceMesh) {
        await faceMesh.send({ image: videoElement });
      }
      requestAnimationFrame(processVideoFrame);
    }

    // Inicialización de la cámara seleccionada
    async function initCamera() {
      setupFaceMesh();

      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const cameraSelect = document.getElementById('cameraSelect');
      const deviceId = cameraSelect.value;

      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } : { facingMode: "user" }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElement.srcObject = currentStream;

        videoElement.onloadedmetadata = () => {
          videoElement.play();
          isProcessing = true;
          requestAnimationFrame(processVideoFrame);

          document.getElementById('status_overlay').innerText = "Cámara Activa";
          document.getElementById('status_overlay').className = "bg-gray-950/90 px-3 py-1 rounded-full border border-gray-800 text-xs text-green-400 font-mono";

          // Actualizar lista de cámaras si la primera vez no tenían etiquetas
          if (!cameraSelect.value) {
            getCameraDevices();
          }

          renderButtons();
        };
      } catch (err) {
        console.error("Error al acceder a la cámara:", err);
        alert("No se pudo iniciar la cámara seleccionada. Verifica los permisos de tu navegador.");
      }
    }

    function switchCamera() {
      if (currentStream) {
        initCamera();
      }
    }

    // Análisis de métricas fotométricas (Brillo, Contraste)
    function analyzeQualityMetrics() {
      if (!videoElement.videoWidth) return;

      let tempCanvas = document.createElement('canvas');
      tempCanvas.width = 100;
      tempCanvas.height = 100;
      let ctx = tempCanvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, 100, 100);
      let imgData = ctx.getImageData(0, 0, 100, 100).data;

      let sumBrightness = 0;
      let values = [];

      for (let i = 0; i < imgData.length; i += 4) {
        let avg = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
        sumBrightness += avg;
        values.push(avg);
      }

      let meanBrightness = sumBrightness / values.length;

      // Cálculo de desviación estándar para contraste
      let variance = values.reduce((acc, val) => acc + Math.pow(val - meanBrightness, 2), 0) / values.length;
      let stdDevContrast = Math.sqrt(variance);

      imageMetrics.brightness = Math.round(meanBrightness);
      imageMetrics.contrast = Math.round(stdDevContrast);

      // Evaluación cualitativa de calidad de foto
      if (meanBrightness > 70 && meanBrightness < 180 && stdDevContrast > 30) {
        imageMetrics.status = "Óptima (Alta Nitidez)";
      } else {
        imageMetrics.status = "Aceptable (Ajustar Luz)";
      }

      document.getElementById('light_overlay').innerText = `Brillo: ${imageMetrics.brightness}`;
      document.getElementById('contrast_overlay').innerText = `Contraste: ${imageMetrics.contrast}`;
    }

    function captureStep(id, label) {
      if (!currentLandmarks) {
        alert("Detectando rostro... Por favor colócate de frente a la cámara con buena iluminación.");
        return;
      }

      // 1. Foto Natural
      let tempCanvas = document.createElement('canvas');
      tempCanvas.width = videoElement.videoWidth;
      tempCanvas.height = videoElement.videoHeight;
      let tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(videoElement, 0, 0);
      let naturalData = tempCanvas.toDataURL('image/jpeg', 0.85);

      // 2. Foto con Malla Renderizada
      let meshCanvas = document.createElement('canvas');
      meshCanvas.width = videoElement.videoWidth;
      meshCanvas.height = videoElement.videoHeight;
      let meshCtx = meshCanvas.getContext('2d');
      meshCtx.drawImage(videoElement, 0, 0);
      meshCtx.drawImage(canvasElement, 0, 0);
      let meshData = meshCanvas.toDataURL('image/jpeg', 0.85);

      capturedShots[id] = { 
        label: label, 
        natural: naturalData, 
        mesh: meshData, 
        landmarks: currentLandmarks,
        quality: { ...imageMetrics }
      };

      let btn = document.getElementById(`btnCap${id}`);
      btn.innerText = `✓ ${label}`;
      btn.className = "bg-emerald-600 text-white font-semibold py-2 px-1 rounded text-xs transition";

      const mode = document.getElementById('sessionMode').value;
      const requiredShots = modesConfig[mode].length;
      if (Object.keys(capturedShots).length === requiredShots) {
        document.getElementById('btnPDF').disabled = false;
      }
    }

    // Cálculo dinámico de métricas vectoriales reales
    function calculateVectorMetrics(lm) {
      if (!lm) {
        return {
          ratioRatio: "Ratio 1.25",
          terciosStr: "S:18.8% M:42.1% I:39.1%",
          simetriaStr: "Desv. 3.3 px",
          cantalStr: "7.3°"
        };
      }

      // Inclinación Cantal Reales
      const rightEyeOuter = lm[33];
      const leftEyeOuter = lm[263];
      const dy = Math.abs(leftEyeOuter.y - rightEyeOuter.y);
      const dx = Math.abs(leftEyeOuter.x - rightEyeOuter.x);
      const cantalAngle = (Math.atan2(dy, dx) * (180 / Math.PI)).toFixed(1);

      // Ratio Cigomático
      const zygomaticLeft = lm[234];
      const zygomaticRight = lm[454];
      const faceWidth = Math.hypot(zygomaticRight.x - zygomaticLeft.x, zygomaticRight.y - zygomaticLeft.y);
      
      const chin = lm[152];
      const glabella = lm[10];
      const faceHeight = Math.hypot(chin.x - glabella.x, chin.y - glabella.y);
      const ratio = (faceWidth / (faceHeight || 1)).toFixed(2);

      // Tercios Faciales
      const subnasale = lm[2];
      const tSuperior = Math.abs(glabella.y - lm[70].y);
      const tMedio = Math.abs(subnasale.y - glabella.y);
      const tInferior = Math.abs(chin.y - subnasale.y);
      const totalH = tSuperior + tMedio + tInferior || 1;

      const sPerc = ((tSuperior / totalH) * 100).toFixed(1);
      const mPerc = ((tMedio / totalH) * 100).toFixed(1);
      const iPerc = ((tInferior / totalH) * 100).toFixed(1);

      // Simetría Bilateral
      const leftCheek = lm[116];
      const rightCheek = lm[345];
      const devPx = (Math.abs(leftCheek.y - rightCheek.y) * 100).toFixed(1);

      return {
        ratioRatio: `Ratio ${ratio}`,
        terciosStr: `S:${sPerc}% M:${mPerc}% I:${iPerc}%`,
        simetriaStr: `Desv. ${devPx} px`,
        cantalStr: `${cantalAngle}°`
      };
    }

    // Tabla Resumen Morfométrica (4 Columnas)
    function getSummaryTableData() {
      const lm = capturedShots[1] ? capturedShots[1].landmarks : null;
      const metrics = calculateVectorMetrics(lm);
      const isFemale = document.querySelector('input[name="genderSelect"]:checked').value === 'female';

      return [
        [
          "Rostro",
          metrics.ratioRatio,
          "Forma Diamante",
          "Pómulos altos y definidos con frente y mandíbula proporcionalmente más estrechas."
        ],
        [
          "Tercios",
          metrics.terciosStr,
          isFemale ? "Distribución Proporcionada" : "Dominancia Mandibular",
          "Equilibrio entre el tercio superior, medio e inferior según el estándar morfométrico."
        ],
        [
          "Simetría",
          metrics.simetriaStr,
          "Simetría Armónica Natural",
          "Variaciones casi imperceptibles en la posición de rasgos que aportan balance bilateral."
        ],
        [
          "Quintos",
          "Transversal",
          "Proporción Áurea Lateral",
          "División horizontal equilibrada en cinco segmentos respecto al ancho ocular."
        ],
        [
          "Nariz",
          "Base Alar",
          "Alineación Intercantal",
          "Ancho de la base nasal en concordancia exacta con la distancia entre ambos cantos internos."
        ],
        [
          "Inclinación Cantal",
          metrics.cantalStr,
          "Inclinación Positiva Marcada",
          "Esquina externa del ojo (canto lateral) situada por encima de la esquina interna."
        ]
      ];
    }

    // Lista Exhaustiva de Diagnósticos Detallados con "Por qué"
    function getExhaustiveDiagnostics() {
      const isFemale = document.querySelector('input[name="genderSelect"]:checked').value === 'female';
      const q = capturedShots[1] ? capturedShots[1].quality : imageMetrics;

      return [
        {
          title: "Calidad de la Piel y Captura",
          class: `Claridad Saludable (${q.status})`,
          why: `Ausencia de inflamación activa. Tono constante. Brillo registrado: ${q.brightness}, Contraste: ${q.contrast}.`
        },
        {
          title: "Forma del Cráneo",
          class: "Mesocéfalo Perfecto",
          why: "Equilibrio ideal entre el ancho y el largo del cráneo; proporciona el soporte perfecto para pómulos altos y perfil alineado."
        },
        {
          title: "Inclinación de la Frente",
          class: isFemale ? "Inclinación Suave y Armónica" : "Inclinación Masculina Definida (80 a 84 Grados)",
          why: isFemale ? "Curva continua que suaviza el tercio superior." : "Sutil pendiente hacia atrás que añade profundidad al arco superciliar aportando aspecto estructural."
        },
        {
          title: "Simetría Facial",
          class: "Simetría Armónica Natural",
          why: "Variaciones casi imperceptibles en la posición de rasgos que aportan realismo sin comprometer el balance bilateral."
        },
        {
          title: "Regla de los Tercios",
          class: isFemale ? "Proporción Equilibrada de Tercios" : "Dominancia Mandibular (18%/39%/43%)",
          why: isFemale ? "Transición armoniosa entre frente, nariz y mentón." : "Tercio inferior fuerte, rasgo principal de estructura y presencia biológica."
        },
        {
          title: "Grasa Bucal",
          class: isFemale ? "Volumen Módico Armónico" : "Transición Plana y Limpia",
          why: isFemale ? "Tejido adiposo suave que conserva la lozanía." : "Línea recta y atlética entre pómulo y mandíbula, libre de excesos de tejido blando."
        },
        {
          title: "Forma de las Orejas",
          class: "Orejas Armónicas Proporcionales",
          why: "Tienen un tamaño equilibrado, ocupando el espacio entre la línea de la ceja y la base nasal."
        },
        {
          title: "Tamaño de las Orejas",
          class: "Proporción Áurea",
          why: "El tamaño coincide exactamente con la longitud nasal, creando simetría visual."
        },
        {
          title: "Formas de la Mandíbula",
          class: isFemale ? "Línea Mandibular Estilizada" : "Mandíbula de V Marcada",
          why: isFemale ? "Trazado cónico fluido hacia el mentón." : "Líneas rectas firmes que convergen en un mentón definido con aspecto atlético."
        },
        {
          title: "Proyección de la Mandíbula",
          class: "Ortognatismo Perfecto",
          why: "La proyección del mentón está alineada con la glabela y la base de la nariz, creando un perfil balanceado."
        },
        {
          title: "Inclinación del Mentón",
          class: isFemale ? "Mentón Neutro Estilizado" : "Prognatismo Masculino Primitivo (1 a 3 mm)",
          why: isFemale ? "Alineación estética correcta con el labio superior." : "El mentón se proyecta ligeramente por delante de la línea vertical de la glabela."
        },
        {
          title: "Proyección del Maxilar",
          class: "Maxilar de Crecimiento Anterior Óptimo",
          why: "El hueso maxilar se proyecta correctamente hacia adelante, proporcionando soporte total para los pómulos."
        },
        {
          title: "Arco Superciliar",
          class: isFemale ? "Arco Ciliar Nivelado" : "Prominencia Masculina Dominante",
          why: isFemale ? "Transición superior lisa que aporta luminosidad a la mirada." : "Hueso grueso y proyectado que genera sombra profunda sobre el ojo."
        },
        {
          title: "Profundidad del Ojo",
          class: "Profundidad Marcada",
          why: "El globo ocular se encuentra resguardado adecuadamente dentro de la cavidad orbital."
        },
        {
          title: "Exposición del Párpado Superior",
          class: isFemale ? "Exposición Palpebral Natural" : "Párpado Oculto (Hooded)",
          why: isFemale ? "Visibilidad clara del párpado móvil." : "Mínima exposición de la piel del párpado móvil para una mirada compacta."
        },
        {
          title: "Unión Cuello-Mandíbula",
          class: "Ángulo Agudo (90 grados o menos)",
          why: "Corte limpio y definido entre la línea mandibular y el cuello, indicador de buen tono de tejido."
        },
        {
          title: "Proporción Cuello-Mandíbula",
          class: "Continuidad Estructural (Proporción Áurea)",
          why: "El cuello fluye con la anchura bigonial de la mandíbula creando estabilidad estética."
        },
        {
          title: "Proyección Anterior de Pómulos",
          class: "Proyección Anterior Óptima",
          why: "El hueso malar sobresale adecuadamente, ofreciendo soporte al párpado inferior."
        },
        {
          title: "Posición Vertical de Pómulos",
          class: "Elevación Alta (Apex Malar)",
          why: "El punto de máxima proyección se ubica en el tercio superior, estándar de vitalidad."
        },
        {
          title: "Ancho Lateral de Pómulos",
          class: isFemale ? "Anchura Cigomática Definida" : "Ancho Robusto (Dominancia)",
          why: isFemale ? "Soporte malar enmarcado en un óvalo facial armónico." : "Arco cigomático marcadamente ancho que crea una estructura angulada."
        },
        {
          title: "Arco de Sonrisa",
          class: "Arco de Sonrisa Ideal (Concordante)",
          why: "El borde de los dientes superiores sigue la curvatura del labio inferior."
        },
        {
          title: "Forma de los Labios",
          class: "Arco de Cupido Definido",
          why: "La región del bermellón superior presenta un contorno céntrico bien marcado."
        },
        {
          title: "Grosor de los Labios",
          class: "Grosor Proporcionado (Relación 1 a 1.6)",
          why: "El labio inferior mantiene la relación de proporción respecto al superior."
        },
        {
          title: "Tonalidades de los Labios",
          class: "Rosado Salmón",
          why: "Tono rosado con matices cálidos que denota buena microcirculación."
        },
        {
          title: "Formas del Ojo",
          class: isFemale ? "Ojos Almendrados Definidos" : "Ojos de Cazador (Hunter Eyes)",
          why: isFemale ? "Apertura alargada y expresividad limpia." : "Forma compacta con apoyo del párpado inferior e inclinación positiva."
        },
        {
          title: "Inclinación de los Ojos",
          class: "Inclinación Positiva Marcada (5 a 8 grados)",
          why: "La esquina externa (canto lateral) se ubica por encima de la esquina interna."
        },
        {
          title: "Forma del Rostro",
          class: "Diamante",
          why: "Pómulos como el punto de mayor amplitud horizontal, creando una estructura bien definida."
        }
      ];
    }

    // Generación del Expediente PDF Completo
    function generatePDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      
      const age = document.getElementById('ageInput').value;
      const gender = document.querySelector('input[name="genderSelect"]:checked').value === 'female' ? 'Femenino' : 'Masculino';
      const mode = document.getElementById('sessionMode').value;
      const dateStr = new Date().toLocaleDateString('es-ES');

      // --- PÁGINA 1: Encabezado, Galería y Tabla Resumen ---
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setTextColor(59, 130, 246);
      doc.setFontSize(18);
      doc.setFont("helvetica", "bold");
      doc.text("VISAGELAB - EXPEDIENTE BIOMÉTRICO", 14, 16);

      doc.setTextColor(148, 163, 184);
      doc.setFontSize(8.5);
      doc.setFont("helvetica", "normal");
      doc.text(`Fecha: ${dateStr}   |   Sujeto: ${gender} (${age} años)   |   Modo: ${mode.toUpperCase()}`, 14, 22);

      // Galería Principal
      if (capturedShots[1]) {
        doc.addImage(capturedShots[1].natural, 'JPEG', 14, 26, 88, 48);
        doc.addImage(capturedShots[1].mesh, 'JPEG', 106, 26, 88, 48);

        doc.setFontSize(7);
        doc.setTextColor(148, 163, 184);
        doc.text("Fotografía Natural", 14, 77);
        doc.text("Fotografía con Malla Triangulada", 106, 77);
      }

      // TABLA RESUMEN MORFOMÉTRICA
      doc.setTextColor(59, 130, 246);
      doc.setFontSize(11);
      doc.setFont("helvetica", "bold");
      doc.text("MATRIZ MÉTRICA Y VECTORES MORFOLÓGICOS", 14, 84);

      doc.autoTable({
        startY: 87,
        head: [['Estructura', 'Métrica / Vector', 'Clasificación Cualitativa / Taxonomía', 'Explicación Biométrica']],
        body: getSummaryTableData(),
        theme: 'grid',
        headStyles: {
          fillColor: [30, 58, 138],
          textColor: [255, 255, 255],
          fontSize: 8,
          fontStyle: 'bold'
        },
        bodyStyles: {
          fillColor: [15, 23, 42],
          textColor: [226, 232, 240],
          fontSize: 7.5,
          lineColor: [51, 65, 85]
        },
        columnStyles: {
          0: { cellWidth: 28, fontStyle: 'bold' },
          1: { cellWidth: 38, textColor: [59, 130, 246] },
          2: { cellWidth: 42, fontStyle: 'bold' },
          3: { cellWidth: 'auto' }
        },
        styles: {
          cellPadding: 2.5,
          overflow: 'linebreak'
        }
      });

      // Registro de tomas adicionales
      let currentY = doc.lastAutoTable.finalY + 8;
      const shotKeys = Object.keys(capturedShots).filter(k => k !== "1");

      if (shotKeys.length > 0) {
        if (currentY > 220) {
          doc.addPage();
          doc.setFillColor(15, 23, 42);
          doc.rect(0, 0, 210, 297, 'F');
          currentY = 16;
        }

        doc.setTextColor(59, 130, 246);
        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.text("REGISTRO DE TOMAS ADICIONALES", 14, currentY);
        currentY += 5;

        shotKeys.forEach((key) => {
          const item = capturedShots[key];
          if (currentY > 230) {
            doc.addPage();
            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 297, 'F');
            currentY = 16;
          }

          doc.setTextColor(255, 255, 255);
          doc.setFontSize(8);
          doc.text(item.label, 14, currentY);

          doc.addImage(item.natural, 'JPEG', 14, currentY + 2, 88, 42);
          doc.addImage(item.mesh, 'JPEG', 106, currentY + 2, 88, 42);
          currentY += 49;
        });
      }

      // --- PÁGINAS DE DIAGNÓSTICO MORFOMÉTRICO EXHAUSTIVO ---
      doc.addPage();
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setTextColor(59, 130, 246);
      doc.setFontSize(13);
      doc.setFont("helvetica", "bold");
      doc.text("DIAGNÓSTICO MORFOMÉTRICO Y BIOMÉTRICO EXHAUSTIVO (1/2)", 14, 16);

      let y = 25;
      const exhaustiveList = getExhaustiveDiagnostics();
      const halfIndex = Math.ceil(exhaustiveList.length / 2);

      const firstHalf = exhaustiveList.slice(0, halfIndex);
      const secondHalf = exhaustiveList.slice(halfIndex);

      firstHalf.forEach((item) => {
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.text(item.title, 14, y);

        doc.setTextColor(59, 130, 246);
        doc.setFont("helvetica", "normal");
        doc.text(`Clasificación: ${item.class}`, 14, y + 4);

        doc.setTextColor(203, 213, 225);
        doc.setFontSize(8);
        let lines = doc.splitTextToSize(`Por qué: ${item.why}`, 180);
        doc.text(lines, 14, y + 8);

        y += 18;
      });

      // Segunda página de diagnósticos exhaustivos
      doc.addPage();
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, 210, 297, 'F');

      doc.setTextColor(59, 130, 246);
      doc.setFontSize(13);
      doc.setFont("helvetica", "bold");
      doc.text("DIAGNÓSTICO MORFOMÉTRICO Y BIOMÉTRICO EXHAUSTIVO (2/2)", 14, 16);

      y = 25;

      secondHalf.forEach((item) => {
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        doc.text(item.title, 14, y);

        doc.setTextColor(59, 130, 246);
        doc.setFont("helvetica", "normal");
        doc.text(`Clasificación: ${item.class}`, 14, y + 4);

        doc.setTextColor(203, 213, 225);
        doc.setFontSize(8);
        let lines = doc.splitTextToSize(`Por qué: ${item.why}`, 180);
        doc.text(lines, 14, y + 8);

        y += 18;
      });

      doc.save(`VisageLab_Expediente_Biometrico_${Date.now()}.pdf`);
    }

    // Cargar cámaras al iniciar la página
    window.onload = () => {
      getCameraDevices();
      renderButtons();
    };
  </script>
