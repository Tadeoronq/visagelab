<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisageLab - Expediente Biométrico Facial</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- MediaPipe FaceMesh Librerías Esenciales -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Tus estilos personalizados (verifica si tu archivo se llama styles.css o stateless.css) -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-4">
    
    <!-- Selector de Cámaras (Frontal / Trasera) -->
    <div class="flex flex-col gap-1">
      <label for="cameraSelect" class="text-xs font-semibold text-slate-400">Seleccionar Cámara:</label>
      <select id="cameraSelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
        <option value="">Buscando cámaras...</option>
      </select>
    </div>

    <!-- Botón de Exportar PDF -->
    <button id="btnExportPDF" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-xl transition shadow-lg opacity-50 cursor-not-allowed" disabled>
      📄 Exportar Expediente PDF
    </button>

    <!-- Modos de Análisis -->
    <div class="flex flex-col gap-2">
      <label class="flex items-center gap-2 p-2.5 rounded-xl border border-blue-600/50 bg-slate-800/60 cursor-pointer">
        <input type="radio" name="analysisMode" value="express" checked class="accent-blue-500">
        <div class="flex flex-col">
          <span class="text-sm font-bold text-white">Análisis Express</span>
          <span class="text-xs text-slate-400">2 Capturas: Frontal + Perfil</span>
        </div>
      </label>
      
      <label class="flex items-center gap-2 p-2.5 rounded-xl border border-slate-800 bg-slate-800/30 cursor-pointer">
        <input type="radio" name="analysisMode" value="full" class="accent-blue-500">
        <div class="flex flex-col">
          <span class="text-sm font-bold text-white">Análisis Completo</span>
          <span class="text-xs text-slate-400">6 Capturas Multiángulo</span>
        </div>
      </label>
    </div>

    <!-- Contenedor de Video / Canvas de la Cámara -->
    <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover hidden" autoplay playsinline muted></video>
      <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover"></canvas>
    </div>

    <!-- Botón de Captura (Manual) -->
    <button id="btnCapture" class="w-full bg-slate-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg opacity-40 cursor-not-allowed flex items-center justify-center gap-2" disabled>
      📷 <span id="captureStepText">Capturar Foto (Foto 1: Frontal)</span>
    </button>

    <!-- Semáforo de Calidad -->
    <div class="grid grid-cols-2 gap-2 bg-slate-950/50 p-3 rounded-xl border border-slate-800/80">
      <div class="flex items-center gap-2 text-xs text-slate-300">
        <span id="dot-light" class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.8)]"></span>
        <span>Luz / Iluminación</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-300">
        <span id="dot-contrast" class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.8)]"></span>
        <span>Contraste Fondo</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-300">
        <span id="dot-pose" class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.8)]"></span>
        <span>Inclinación Cabeza</span>
      </div>
      <div class="flex items-center gap-2 text-xs text-slate-300">
        <span id="dot-quality" class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.8)]"></span>
        <span>Calidad Foto</span>
      </div>
    </div>

    <!-- Contenedor de Rasgos Faciales Evaluados -->
    <div id="traits-list" class="flex flex-col gap-1 max-h-48 overflow-y-auto px-1"></div>

  </div>

  <!-- Carga de Módulos Propios en el Orden Correcto -->
  <script src="facial-taxonomy.js"></script>
  <script src="biometrics.js"></script>
  <script src="facial-traits.js"></script>
  <script src="pdf-generator.js"></script>
  <script src="app.js"></script>
  <!-- El controlador de cámara y semáforo va al final -->
  <script src="main.js"></script>
</body>
</html>
