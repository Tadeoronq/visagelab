<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisageLab - Diagnóstico Biométrico Avanzado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe / Canvas / jsPDF -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 p-4 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wider text-cyan-400">VISAGELAB <span class="text-xs text-slate-400 font-normal">v2.5 Pro</span></h1>
      <span class="text-xs px-2.5 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800">Motor Diagnóstico Activo</span>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Panel de Control e Ingesta -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      
      <!-- Calibration Box -->
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4 shadow-lg">
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
          <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
          Calibración del Sujeto
        </h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Sexo Biológico</label>
            <select id="genderSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-cyan-500 outline-none">
              <option value="masculino">Masculino</option>
              <option value="femenino">Femenino</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Edad del Sujeto</label>
            <input type="number" id="ageInput" value="25" min="1" max="120" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-cyan-500 outline-none">
          </div>
        </div>
      </div>

      <!-- Live Camera Feed -->
      <div class="relative bg-slate-950 border border-slate-800 rounded-xl overflow-hidden aspect-video flex items-center justify-center">
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
        <canvas id="meshCanvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
        <div class="absolute bottom-2 left-2 bg-slate-900/80 backdrop-blur px-2 py-1 rounded text-[10px] text-slate-400 border border-slate-700/50">
          Feed en vivo + MediaPipe Mesh
        </div>
      </div>

      <!-- Actions -->
      <div class="grid grid-cols-2 gap-3">
        <button id="btnCapture1" onclick="captureFrame(1)" class="bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
          1. Frontal Neutra
        </button>
        <button id="btnCapture2" onclick="captureFrame(2)" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2">
          2. Perfil 90°
        </button>
      </div>

      <button id="btnGeneratePDF" onclick="generatePDFReport()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg text-sm shadow-lg transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        Generar Expediente PDF
      </button>

    </section>

    <!-- Panel de Resultados y Previsualización -->
    <section class="lg:col-span-7 bg-slate-800/40 border border-slate-800 rounded-xl p-4 md:p-6 overflow-y-auto max-h-[85vh]">
      <h2 class="text-base font-semibold text-slate-200 mb-4 border-b border-slate-700/60 pb-2">Previsualización del Diagnóstico</h2>
      <div id="diagnosticResults" class="space-y-4 text-xs">
        <p class="text-slate-500 italic">Captura ambas tomas para procesar los indicadores biométricos con la nueva matriz condicional.</p>
      </div>
    </section>

  </main>

  <script>
    // Variable global para almacenar el estado
    const captures = { 1: null, 2: null };
    
    // Inicialización simulada de FaceMesh / Cámara
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('meshCanvas');
    
    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      video.srcObject = stream;
    }).catch(err => console.error("Error al acceder a la cámara: ", err));

    function captureFrame(step) {
      const gender = document.getElementById('genderSelect').value;
      const age = parseInt(document.getElementById('ageInput').value);
      
      captures[step] = { gender, age, timestamp: new Date().toISOString() };
      
      alert(`Toma ${step} capturada exitosamente con parametrización (${gender.toUpperCase()}, ${age} años).`);
      
      if(captures[1] || captures[2]) {
        renderDiagnosticPreview(gender, age);
      }
    }

    function renderDiagnosticPreview(gender, age) {
      const container = document.getElementById('diagnosticResults');
      
      // Ejemplo de asignación condicional según sexo y edad
      const isFem = gender === 'femenino';
      
      const pArcoSuperciliar = isFem ? "Convexidad Lisa y Delicada (Arquetipo de Élite)" : "Prominencia Masculina Dominante";
      const pMandibula = isFem ? "Mandíbula en V Pulida (V-Line de Élite)" : "Mandíbula de V Marcada";
      const pFrente = isFem ? "Verticalidad Redondeada (90 Grados Femenina)" : "Inclinación Masculina Definida (80 a 84 Grados)";
      const pParpado = isFem ? "Exposición Definida Almendrada" : "Párpado Oculto (Hooded)";
      
      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <!-- Bloque Morfológico -->
          <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
            <h3 class="text-cyan-400 font-semibold mb-2 uppercase tracking-wider text-[11px]">1. Análisis Morfológico y Estructural</h3>
            <ul class="space-y-2">
              <li><strong class="text-slate-300">Arco Superciliar:</strong> <span class="text-slate-400">${pArcoSuperciliar}</span></li>
              <li><strong class="text-slate-300">Forma Mandibular:</strong> <span class="text-slate-400">${pMandibula}</span></li>
              <li><strong class="text-slate-300">Inclinación de Frente:</strong> <span class="text-slate-400">${pFrente}</span></li>
              <li><strong class="text-slate-300">Párpado Superior:</strong> <span class="text-slate-400">${pParpado}</span></li>
            </ul>
          </div>

          <!-- Bloque Colorimetría -->
          <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-700/50">
            <h3 class="text-amber-400 font-semibold mb-2 uppercase tracking-wider text-[11px]">2. Colorimetría y Subtonos (Pixeles)</h3>
            <ul class="space-y-2">
              <li><strong class="text-slate-300">Tono de Piel:</strong> <span class="text-slate-400">Intermedio / Neutro Claro (Fitzpatrick III)</span></li>
              <li><strong class="text-slate-300">Subtono:</strong> <span class="text-slate-400">Cálido (Dorado / Melocotón)</span></li>
              <li><strong class="text-slate-300">Estación Cromática:</strong> <span class="text-slate-400">Otoño Suave</span></li>
              <li><strong class="text-slate-300">Tonalidad Labial:</strong> <span class="text-slate-400">Rosado Salmón</span></li>
            </ul>
          </div>

        </div>
      `;
    }

    function generatePDFReport() {
      if (!captures[1] && !captures[2]) {
        alert("Por favor realiza al menos una captura antes de generar el PDF.");
        return;
      }
      alert("Generando expediente en PDF con la nueva taxonomía y datos calibrados...");
    }
  </script>
</body>
</html>
